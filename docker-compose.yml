name: olympus

# Network Configuration:
# Docker Compose automatically creates a default bridge network for all services.
# All services (api, redis, spicedb) communicate on this shared network using service names as hostnames.
# - API → SpiceDB: Uses "spicedb:50051" for gRPC communication
# - API → Redis: Uses "redis:6379" for cache/session storage
# No explicit network definition needed - default network provides service discovery and isolation.

services:
  postgres:
    image: supabase/postgres:15.8.1.085
    container_name: olympus-postgres
    platform: linux/amd64  # For M1/ARM64 Macs
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: olympus_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust  # For local dev only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/scripts/init-auth-schema.sql:/docker-entrypoint-initdb.d/01-auth-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  spicedb:
    build:
      context: ./spicedb
      dockerfile: Dockerfile
    platform: linux/amd64
    command: serve
    ports:
      - "50051:50051"  # gRPC
      - "8443:8443"    # HTTP
    environment:
      - SPICEDB_DATASTORE_ENGINE=postgres
      - SPICEDB_DATASTORE_CONN_URI=${SPICEDB_DATASTORE_CONN_URI}
      - SPICEDB_GRPC_PRESHARED_KEY=${SPICEDB_TOKEN}
    healthcheck:
      test: ["CMD", "grpcurl", "-plaintext", "localhost:50051", "grpc.health.v1.Health/Check"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    env_file:
      - ./apps/api/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    depends_on:
      redis:
        condition: service_healthy
      spicedb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: