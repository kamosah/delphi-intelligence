query GetOrganizations($limit: Int, $offset: Int) {
  organizations(limit: $limit, offset: $offset) {
    id
    name
    slug
    description
    ownerId
    memberCount
    spaceCount
    threadCount
    createdAt
    updatedAt
    isDefault
    lastActiveAt
  }
}

query GetOrganization($id: ID!) {
  organization(id: $id) {
    id
    name
    slug
    description
    ownerId
    memberCount
    spaceCount
    threadCount
    createdAt
    updatedAt
    isDefault
    lastActiveAt
  }
}

query GetOrganizationMembers($organizationId: ID!, $limit: Int, $offset: Int) {
  organizationMembers(organizationId: $organizationId, limit: $limit, offset: $offset) {
    id
    organizationId
    userId
    role
    createdAt
    user {
      id
      email
      fullName
      avatarUrl
    }
  }
}

query GetOrganizationInvitations($organizationId: ID!, $status: InvitationStatus) {
  organizationInvitations(organizationId: $organizationId, status: $status) {
    id
    organizationId
    inviteeEmail
    invitationRole
    status
    invitedBy
    invitedAt
    expiresAt
    acceptedAt
    revokedAt
    revokedBy
    customMessage
    createdAt
    updatedAt
  }
}

query GetMyPendingInvitations {
  myPendingInvitations {
    id
    organizationId
    inviteeEmail
    invitationRole
    status
    invitedBy
    invitedAt
    expiresAt
    customMessage
    createdAt
    updatedAt
  }
}
