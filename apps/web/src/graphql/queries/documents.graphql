# ============================================
# Document Query Operations
# ============================================

query GetDocuments(
  $spaceId: ID
  $organizationId: ID
  $limit: Int
  $offset: Int
  $sort: DocumentSortInput
  $filters: DocumentFilterInput
) {
  documents(
    spaceId: $spaceId
    organizationId: $organizationId
    limit: $limit
    offset: $offset
    sort: $sort
    filters: $filters
  ) {
    id
    name
    fileType
    filePath
    status
    spaceId
    uploadedBy
    sizeBytes
    processingError
    processedAt
    createdAt
    updatedAt
  }
}

query SearchDocuments($input: SearchDocumentsInput!) {
  searchDocuments(input: $input) {
    chunk {
      id
      documentId
      chunkText
      chunkIndex
      tokenCount
      startChar
      endChar
      chunkMetadata
      createdAt
    }
    document {
      id
      name
      fileType
      filePath
      sizeBytes
      status
      spaceId
      uploadedBy
      docMetadata
      extractedText
      processingError
      processedAt
      createdAt
      updatedAt
    }
    similarityScore
    distance
  }
}
