schema {
  query: Query
  mutation: Mutation
}

input AddOrganizationMemberInput {
  organizationId: ID!
  role: OrganizationRole! = MEMBER
  userId: ID!
}

enum AuthorTypeEnum {
  AGENT
  SYSTEM
  USER
}

input BulkDeleteDocumentsInput {
  documentIds: [ID!]!
}

type BulkDeleteResult {
  deletedCount: Int!
  failedIds: [ID!]!
  storageFailures: [ID!]!
}

input CreateOrganizationInput {
  description: String = null
  name: String!
  slug: String = null
}

input CreateSpaceInput {
  description: String = null
  iconColor: String = null
  name: String!
  organizationId: ID!
}

input CreateThreadInput {
  """Optional confidence score (0.0-1.0)"""
  confidenceScore: Float = null
  """
  Organization context (required for SPACE/ORGANIZATION threads, null for PERSONAL)
  """
  organizationId: ID = null
  """User's question or query text"""
  queryText: String!
  """Optional pre-computed result (for manual thread creation)"""
  result: String = null
  """
  Space context (required for SPACE threads, null for PERSONAL/ORGANIZATION)
  """
  spaceId: ID = null
  """Optional thread title"""
  title: String = null
  """
  Visibility scope: PERSONAL (owner only), SPACE (team members), ORGANIZATION (all org members)
  """
  visibility: ThreadVisibilityEnum!
}

input CreateUserInput {
  avatarUrl: String = null
  bio: String = null
  email: String!
  fullName: String = null
}

type DashboardStats {
  threadsThisMonth: Int!
  totalDocuments: Int!
  totalSpaces: Int!
  totalThreads: Int!
}

"""Date with time (isoformat)"""
scalar DateTime

input DeleteDocumentInput {
  documentId: ID!
  spaceId: ID!
}

type Document {
  createdAt: DateTime!
  docMetadata: JSON
  extractedText: String
  filePath: String!
  fileType: String!
  id: ID!
  name: String!
  processedAt: DateTime
  processingError: String
  sizeBytes: Int!
  space: Space
  spaceId: ID!
  status: String!
  updatedAt: DateTime!
  uploadedBy: ID!
}

type DocumentChunk {
  chunkIndex: Int!
  chunkMetadata: JSON!
  chunkText: String!
  createdAt: DateTime!
  documentId: ID!
  endChar: Int!
  id: ID!
  startChar: Int!
  tokenCount: Int!
}

input DocumentFilterInput {
  fileTypes: [String!] = null
  search: String = null
  statuses: [String!] = null
  uploadedAfter: DateTime = null
  uploadedBefore: DateTime = null
}

enum DocumentSortField {
  CREATED_AT
  FILE_TYPE
  NAME
  SIZE
  STATUS
  UPDATED_AT
}

input DocumentSortInput {
  field: DocumentSortField!
  order: SortOrder! = DESC
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf).
"""
scalar JSON

type Message {
  authorType: AuthorTypeEnum!
  authorUserId: ID
  content: String!
  createdAt: DateTime!
  id: ID!
  messageMetadata: JSON!
  messageRole: MessageRole!
  threadId: ID!
  updatedAt: DateTime!
}

enum MessageRole {
  ASSISTANT
  SYSTEM
  USER
}

type Mutation {
  addOrganizationMember(input: AddOrganizationMemberInput!): OrganizationMember!
  bulkDeleteDocuments(input: BulkDeleteDocumentsInput!): BulkDeleteResult!
  createOrganization(input: CreateOrganizationInput!): Organization!
  createSpace(input: CreateSpaceInput!): Space!
  createThread(input: CreateThreadInput!): Thread
  createUser(input: CreateUserInput!): User!
  deleteDocument(input: DeleteDocumentInput!): Boolean!
  deleteOrganization(id: ID!): Boolean!
  deleteSpace(id: ID!): Boolean!
  deleteThread(id: ID!): Boolean!
  deleteUser(id: ID!): Boolean!
  removeOrganizationMember(organizationId: ID!, userId: ID!): Boolean!
  switchOrganization(input: SwitchOrganizationInput!): Organization!
  updateMemberRole(organizationId: ID!, role: OrganizationRole!, userId: ID!): OrganizationMember
  updateOrganization(id: ID!, input: UpdateOrganizationInput!): Organization
  updateSpace(id: ID!, input: UpdateSpaceInput!): Space
  updateThread(id: ID!, input: UpdateThreadInput!): Thread
  updateUser(id: ID!, input: UpdateUserInput!): User
  updateUserPreferences(input: UpdateUserPreferencesInput!): UserPreferences!
}

type Organization {
  createdAt: DateTime!
  description: String
  id: ID!
  isDefault: Boolean
  lastActiveAt: DateTime
  memberCount: Int!
  name: String!
  ownerId: ID
  slug: String!
  spaceCount: Int!
  threadCount: Int!
  updatedAt: DateTime!
}

type OrganizationMember {
  createdAt: DateTime!
  id: ID!
  isDefault: Boolean!
  lastActiveAt: DateTime
  organizationId: ID!
  role: OrganizationRole!
  user: User
  userId: ID!
}

enum OrganizationRole {
  ADMIN
  MEMBER
  OWNER
  VIEWER
}

type Query {
  dashboardStats(organizationId: ID = null): DashboardStats!
  documents(filters: DocumentFilterInput = null, limit: Int! = 100, offset: Int! = 0, organizationId: ID = null, sort: DocumentSortInput = null, spaceId: ID = null): [Document!]!
  health: String!
  me: User!
  organization(id: ID!): Organization
  organizationMembers(limit: Int! = 50, offset: Int! = 0, organizationId: ID!): [OrganizationMember!]!
  organizations(limit: Int! = 10, offset: Int! = 0): [Organization!]!
  searchDocuments(input: SearchDocumentsInput!): [SearchResult!]!
  space(id: ID!): Space
  spaces(limit: Int! = 10, offset: Int! = 0, organizationId: ID = null): [Space!]!
  thread(id: ID!): Thread
  threads(limit: Int! = 50, offset: Int! = 0, organizationId: ID = null, spaceId: ID = null): [Thread!]!
  user(id: ID!): User
  userByEmail(email: String!): User
  userPreferences: UserPreferences
  users(limit: Int! = 10, offset: Int! = 0): [User!]!
}

input SearchDocumentsInput {
  documentIds: [ID!] = null
  limit: Int! = 10
  query: String!
  similarityThreshold: Float! = 0
  spaceId: ID = null
}

type SearchResult {
  chunk: DocumentChunk!
  distance: Float!
  document: Document!
  similarityScore: Float!
}

enum SortOrder {
  ASC
  DESC
}

type Space {
  createdAt: DateTime!
  description: String
  documentCount: Int!
  iconColor: String
  id: ID!
  isPublic: Boolean!
  maxMembers: Int
  memberCount: Int!
  name: String!
  ownerId: ID!
  slug: String!
  updatedAt: DateTime!
}

input SwitchOrganizationInput {
  organizationId: ID!
}

type Thread {
  agentSteps: JSON
  completedAt: DateTime
  confidenceScore: Float
  context: String
  costUsd: Float
  createdAt: DateTime!
  """Original creator (immutable provenance). Null when user deleted."""
  createdBy: ID
  errorMessage: String
  id: ID!
  isStarred: Boolean!
  messages: [Message!]!
  modelUsed: String
  """Organization context (null for personal threads)"""
  organizationId: ID
  """
  Current owner (mutable). Null when user deleted, triggers reassignment.
  """
  ownerUserId: ID
  processingTimeMs: Int
  queryText: String!
  result: String
  sources: JSON
  """Space context (null for personal/org-wide threads)"""
  spaceId: ID
  status: ThreadStatusEnum
  title: String
  tokensUsed: Int
  updatedAt: DateTime!
  """
  Visibility scope: PERSONAL (owner only), SPACE (team members), ORGANIZATION (all org members)
  """
  visibility: ThreadVisibilityEnum!
}

enum ThreadStatusEnum {
  COMPLETED
  FAILED
  PENDING
  PROCESSING
}

enum ThreadVisibilityEnum {
  ORGANIZATION
  PERSONAL
  SPACE
}

input UpdateOrganizationInput {
  description: String = null
  name: String = null
}

input UpdateSpaceInput {
  description: String = null
  iconColor: String = null
  name: String = null
}

input UpdateThreadInput {
  isStarred: Boolean = null
  result: String = null
  title: String = null
}

input UpdateUserInput {
  avatarUrl: String = null
  bio: String = null
  fullName: String = null
}

input UpdateUserPreferencesInput {
  browserNotificationsEnabled: Boolean = null
  customSettings: JSON = null
  emailNotifications: Boolean = null
  language: String = null
  notificationsEnabled: Boolean = null
  theme: String = null
  timezone: String = null
}

type User {
  avatarUrl: String
  bio: String
  createdAt: DateTime!
  email: String!
  emailConfirmed: Boolean!
  fullName: String
  id: ID!
  isActive: Boolean!
  role: String!
  updatedAt: DateTime!
}

type UserPreferences {
  browserNotificationsEnabled: Boolean
  customSettings: JSON
  emailNotifications: Boolean!
  id: ID!
  language: String!
  notificationsEnabled: Boolean!
  theme: String!
  timezone: String
  userId: ID!
}