name: API Tests

on:
    push:
        branches: [main, develop]
        paths:
            - "apps/api/**"
            - ".github/workflows/api-test.yml"
    pull_request:
        branches: [main, develop]
        paths:
            - "apps/api/**"
            - ".github/workflows/api-test.yml"

jobs:
    test:
        name: Run Pytest
        runs-on: ubuntu-latest

        # Service containers for integration tests
        services:
            postgres:
                image: pgvector/pgvector:pg16
                env:
                    POSTGRES_USER: test
                    POSTGRES_PASSWORD: test
                    POSTGRES_DB: olympus_test
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432

            redis:
                image: redis:7-alpine
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 6379:6379

        defaults:
            run:
                working-directory: apps/api

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"

            - name: Install Poetry
              uses: snok/install-poetry@v1
              with:
                  version: latest
                  virtualenvs-create: true
                  virtualenvs-in-project: true

            - name: Load cached venv
              id: cached-poetry-dependencies
              uses: actions/cache@v4
              with:
                  path: .venv
                  key: venv-v2-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

            - name: Install dependencies
              run: poetry install --no-interaction --no-root

            - name: Start SpiceDB test server
              uses: authzed/action-spicedb@v1
              with:
                  version: "v1.48.0"

            - name: Load SpiceDB schema
              run: |
                  docker run --rm --network host \
                    -v ${{ github.workspace }}/apps/api/app/policies:/policies \
                    authzed/zed:latest \
                    schema write /policies/olympus.zed \
                    --endpoint localhost:50051 \
                    --token testtoken \
                    --insecure

            - name: Run pytest with coverage
              env:
                  SPICEDB_ENDPOINT: localhost:50051
                  SPICEDB_TOKEN: testtoken
                  DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/olympus_test
                  REDIS_URL: redis://localhost:6379/0
                  OPENAI_API_KEY: test-openai-api-key
              run: |
                  poetry run pytest -n auto --dist loadscope --cov=app --cov-report=xml --cov-report=html -v

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v4
              with:
                  file: ./apps/api/coverage.xml
                  flags: api
                  fail_ci_if_error: false

            - name: Check test results
              if: failure()
              run: |
                  echo "❌ Tests failed!"
                  echo "Run the following command locally to reproduce:"
                  echo "  poetry run pytest tests/ -v"
                  exit 1

    summary:
        name: API Test Summary
        runs-on: ubuntu-latest
        needs: [test]
        if: always()

        steps:
            - name: Check test status
              if: needs.test.result == 'failure'
              run: |
                  echo "::error::Pytest tests failed. Please run 'poetry run pytest tests/ -v' locally to see errors."
                  exit 1

            - name: Success message
              if: needs.test.result == 'success'
              run: |
                  echo "✅ All tests passed!"
